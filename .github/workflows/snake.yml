name: Contribution Snake

on:
  schedule:
    # Every 2 hours. snk's solver is deterministic, so the route only changes
    # when the grid does; regenerating often is what makes the animation differ
    # between visits rather than being frozen for a whole day.
    - cron: '0 */2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

env:
  SNAKE_USER: JadenRazo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # snk is vendored rather than used via its action because the action
      # exposes no way to vary the route: getBestRoute() has no randomness and
      # the CLI always seeds it with a fixed start pose. snake-gen.ts calls the
      # solver directly so it can randomize that pose. Pinned to the same SHA
      # the fallback action below uses.
      - name: Checkout Platane/snk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
          path: .snk

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # --ignore-scripts skips gifsicle's native build, which is only needed for
      # GIF output and fails on some architectures.
      - name: Install snk dependencies
        working-directory: .snk
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate snake SVGs with a randomized route
        id: gen
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run from inside the workspace package so the relative and @snk/*
          # imports resolve.
          cp .github/scripts/snake-gen.ts .snk/packages/generate-snake-animation/
          cd .snk/packages/generate-snake-animation
          bun run snake-gen.ts "$GITHUB_WORKSPACE/dist"

      # A failed generator may have left a partial dist/ behind, including a
      # snake-meta.json that no longer describes the SVGs the fallback writes.
      - name: Discard partial output before falling back
        if: steps.gen.outcome == 'failure'
        run: rm -rf dist

      # snk's internals are not a stability contract, so if the vendored
      # generator ever breaks the stock action still produces a working (if
      # deterministic) snake. The profile never shows a broken image.
      - name: Fall back to the stock snk action
        if: steps.gen.outcome == 'failure'
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ env.SNAKE_USER }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Overlays the running contribution counter. Exits 0 on any problem and
      # leaves the SVGs untouched, so a bad counter can never break the snake.
      - name: Overlay contribution counter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/add-snake-counter.mjs dist

      - name: Verify SVGs before publishing
        run: |
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
            grep -q '</svg>' "$f" || { echo "::error::$f is truncated"; exit 1; }
          done
          # snake-meta.json is a build artifact, not something to publish.
          rm -f dist/snake-meta.json
          ls -la dist

      # Publishes generated SVGs to the dedicated `output` branch that the
      # README <picture> element references via raw.githubusercontent.com.
      # keep_history is false by design: the branch holds only generated
      # assets, so it is reset on each run instead of accumulating history.
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: 'chore: regenerate contribution snake'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
