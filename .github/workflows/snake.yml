name: Contribution Snake

on:
  schedule:
    # Fresh contribution data and a new starting side/direction every six hours.
    - cron: '11 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

env:
  SNAKE_USER: JadenRazo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuse the pinned renderer and palettes with our bounded growing route.
      - name: Checkout Platane/snk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
          path: .snk

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22

      - name: Prepare dependency-free SVG workspace
        run: node .github/scripts/prepare-snake.mjs .snk

      - name: Test growth and route invariants
        run: |
          node --test .github/scripts/test-snake-*.mjs
          bun test ./.snk/packages/generate-snake-animation/snake.integration.test.ts

      # Failure preserves the last verified output instead of publishing a
      # degraded stock animation without growth or an exact counter.
      - name: Generate growing snake SVGs with a randomized route
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run .snk/packages/generate-snake-animation/snake-gen.ts "$GITHUB_WORKSPACE/dist"

      # The overlay fails safely; the publication gate below rejects an absent
      # counter or growth schedule and preserves the previous good output.
      - name: Overlay contribution counter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/add-snake-counter.mjs dist

      - name: Verify SVGs before publishing
        run: |
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
            grep -q '</svg>' "$f" || { echo "::error::$f is truncated"; exit 1; }
            grep -q '<!--snk-growth v1-->' "$f" || { echo "::error::$f has no growth"; exit 1; }
            grep -q '<!--snk-counter v1-->' "$f" || { echo "::error::$f has no exact counter"; exit 1; }
          done
          # snake-meta.json is a build artifact, not something to publish.
          rm -f dist/snake-meta.json
          ls -la dist

      # Publishes generated SVGs to the dedicated `output` branch that the
      # README <picture> element references via raw.githubusercontent.com.
      # keep_history is false by design: the branch holds only generated
      # assets, so it is reset on each run instead of accumulating history.
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: 'chore: regenerate contribution snake'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
