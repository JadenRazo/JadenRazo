name: 3D Contribution Graph

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 3 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: JadenRazo

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p profile-3d-contrib
          git add profile-3d-contrib/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update 3D contribution graph"
          # Four scheduled workflows commit to main and their crons overlap, so
          # another run can land between the rebase and the push. Retry the
          # whole rebase-and-push instead of failing the job on a lost race.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::rebase/push lost a race (attempt $attempt/5), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
