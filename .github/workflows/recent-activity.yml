name: Recent Activity

on:
  schedule:
    - cron: '30 5 * * *' # Daily at 5:30 AM UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Update recent activity section
        uses: jamesgeorge007/github-activity-readme@4aefbfa1c222d70537dc6a02f0519266aab2b1ea # v0.5.0
        # No-op instead of a red X when there are no recent public events
        # (the action exits non-zero if it finds nothing to write).
        continue-on-error: true
        with:
          GH_USERNAME: JadenRazo
          MAX_LINES: 5
          COMMIT_NAME: github-actions[bot]
          COMMIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          COMMIT_MSG: 'chore: update recent activity'
          EMPTY_COMMIT_MSG: 'chore: no new activity'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
