name: Stats Cards

# Self-hosted github-readme-stats: renders the stats + top-languages cards
# to static SVGs in this repo using the upstream project's own renderer,
# authenticated with the workflow's built-in GITHUB_TOKEN. No hosted
# instance, no PAT to manage.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5

      - name: Checkout github-readme-stats (pinned)
        uses: actions/checkout@v5
        with:
          repository: anuraghazra/github-readme-stats
          ref: 54a7985aeefda00d5eadb55b80c17c7f976c37d2 # master 2026-06-30
          path: .grs

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install renderer dependencies
        working-directory: .grs
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Generate card SVGs
        env:
          # Needs a user token: the built-in GITHUB_TOKEN is an installation
          # token and cannot read user contribution data.
          PAT_1: ${{ secrets.PAT_1 }}
          GRS_DIR: ${{ github.workspace }}/.grs
          OUT_DIR: generated
          STATS_USER: JadenRazo
        run: node .github/scripts/generate-stats-cards.mjs

      - name: Checkout streak-stats (pinned)
        uses: actions/checkout@v5
        with:
          repository: DenverCoder1/github-readme-streak-stats
          ref: v1.7.0
          path: .streak

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl
          tools: composer

      - name: Generate streak SVGs
        env:
          TOKEN: ${{ secrets.PAT_1 }}
        run: |
          cd .streak
          composer install --no-dev --quiet
          php -S 127.0.0.1:8471 -t src >/tmp/streak-php.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null "http://127.0.0.1:8471/?user=JadenRazo" && break; sleep 1; done
          curl -sf "http://127.0.0.1:8471/?user=JadenRazo&hide_border=true&background=00000000&theme=github-dark-blue&ring=39D353&fire=39D353&currStreakLabel=39D353" -o ../generated/streak-dark.svg
          curl -sf "http://127.0.0.1:8471/?user=JadenRazo&hide_border=true&background=00000000&ring=1A7F37&fire=1A7F37&currStreakLabel=1A7F37" -o ../generated/streak-light.svg
          kill %1 || true
          cd ..
          # Refuse to commit an error frame: a real card contains "Current Streak".
          grep -q "Current Streak" generated/streak-dark.svg
          grep -q "Current Streak" generated/streak-light.svg

      - name: Commit if changed
        run: |
          rm -rf .grs
          if git diff --quiet generated/ 2>/dev/null && [ -z "$(git status --porcelain generated/)" ]; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "chore: refresh stats cards"
          git pull --rebase origin main
          git push
