name: Profile Data Health

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify stats, LOC and snake freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/profile_health.py
