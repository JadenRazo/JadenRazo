name: Profile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md

      - name: Validate committed SVG assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          paths = sorted(Path("generated").glob("*.svg"))
          if len(paths) != 7:
              raise SystemExit(f"expected 7 generated SVGs, found {len(paths)}")
          for path in paths:
              ElementTree.parse(path)
              if path.stat().st_size == 0:
                  raise SystemExit(f"{path} is empty")
              print(f"OK {path}")
          PY
