name: Profile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md

      - name: Validate committed SVG assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          paths = sorted(Path("generated").glob("*.svg"))
          if len(paths) != 7:
              raise SystemExit(f"expected 7 generated SVGs, found {len(paths)}")
          for path in paths:
              ElementTree.parse(path)
              if path.stat().st_size == 0:
                  raise SystemExit(f"{path} is empty")
              print(f"OK {path}")
          for path in sorted(Path("assets/badges").glob("*.svg")):
              root = ElementTree.parse(path).getroot()
              if root.find(".//{http://www.w3.org/2000/svg}image") is None:
                  raise SystemExit(f"{path} is missing its embedded logo")
              print(f"OK {path}")
          PY

      - name: Test stats calculations and rejected inputs
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate stats data, timestamps and README image versions
        run: python3 .github/scripts/profile_stats.py --check

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22

      - name: Test snake growth and counter boundaries
        run: node --test .github/scripts/test-snake-*.mjs

      - name: Checkout pinned snake renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
          path: .snk

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Test routes and both rendered palettes without GitHub API access
        run: |
          node .github/scripts/prepare-snake.mjs .snk
          bun test ./.snk/packages/generate-snake-animation/snake.integration.test.ts

      - name: Generate a real-calendar preview
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAKE_USER: JadenRazo
          SNAKE_SEED: 1701
        run: |
          bun run .snk/packages/generate-snake-animation/snake-gen.ts "$RUNNER_TEMP/snake-preview"
          node .github/scripts/add-snake-counter.mjs "$RUNNER_TEMP/snake-preview"

      - name: Verify animation timing in Chromium
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/snake-browser" --ignore-scripts --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/snake-browser/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/check-snake-animation.mjs "$RUNNER_TEMP/snake-preview" "$RUNNER_TEMP/snake-browser/node_modules/playwright" "$RUNNER_TEMP/snake-frames"

      - name: Save snake preview and verification frames
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snake-preview
          path: |
            ${{ runner.temp }}/snake-preview
            ${{ runner.temp }}/snake-frames
          retention-days: 7
          if-no-files-found: ignore
