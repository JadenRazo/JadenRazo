name: Deploy Monitor

# Self-contained uptime check. The previous version only listened for
# repository_dispatch events from an external sender (retired VPS), which
# went silent on 2026-06-25 and left stale data in the README. This version
# probes the sites directly on a schedule; repository_dispatch is kept for
# manual pushes from infrastructure if ever wanted again.
on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [deploy-status]
  workflow_dispatch:

concurrency:
  group: deploy-monitor
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Probe sites
        id: probe
        run: |
          SITES="raizhost.com app.raizhost.com jadenrazo.dev llm.raizhost.com showersautodetail.com"
          # Three timed probes per site, averaged. A single sample punishes a
          # site for one cold TLS handshake or CDN cache miss; the average of
          # three real requests is an honest steady-state number.
          {
            echo '```'
            echo '$ deploy status'
            printf '%-30s %-10s %-6s %-12s\n' "SITE" "STATE" "HTTP" "AVG LATENCY"
            echo '------------------------------------------------------------'
            total_ms=0; up_count=0; site_count=0
            for site in $SITES; do
              site_count=$((site_count + 1))
              sum=0; code="000"; ok=0
              for i in 1 2 3; do
                out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' -m 15 "https://$site" || echo "000 0")
                c=${out% *}
                secs=${out#* }
                case "$c" in 2*|3*) ok=$((ok + 1)); code=$c;; *) [ "$code" = "000" ] && code=$c;; esac
                sum=$(awk -v a="$sum" -v t="$secs" 'BEGIN { printf "%.6f", a + t }')
              done
              if [ "$ok" -gt 0 ]; then
                state="up"
                ms=$(awk -v s="$sum" 'BEGIN { printf "%d", (s / 3) * 1000 }')
                total_ms=$((total_ms + ms)); up_count=$((up_count + 1))
                lat="${ms}ms"
              elif [ "$code" = "000" ]; then
                state="down"; lat="-"
              else
                state="degraded"; lat="-"
              fi
              printf '%-30s %-10s %-6s %-12s\n' "$site" "$state" "$code" "$lat"
            done
            echo '------------------------------------------------------------'
            if [ "$up_count" -gt 0 ]; then
              fleet=$(awk -v t="$total_ms" -v n="$up_count" 'BEGIN { printf "%d", t / n }')
              printf '%-30s %-10s %-6s %-12s\n' "fleet average" "" "" "${fleet}ms"
            fi
            echo ""
            echo "Last check: $(date -u +%Y-%m-%dT%H:%M:%SZ) (3 probes per site, averaged)"
            echo '```'
          } > /tmp/status-block.txt
          cat /tmp/status-block.txt
          # A group command does not fork, so up_count survives the redirect.
          # If the runner lost egress every site reads "down"; that is a probe
          # failure, not an outage, and must not reach the profile.
          echo "up_count=$up_count" >> "$GITHUB_OUTPUT"
          if [ "$up_count" -eq 0 ]; then
            echo "::warning::no site was reachable — skipping publish rather than reporting a fleet outage"
          fi

      - name: Update README block
        if: steps.probe.outputs.up_count != '0'
        run: |
          python3 - <<'PYEOF'
          import re
          block = open("/tmp/status-block.txt").read().rstrip("\n")
          readme = open("README.md").read()
          new = re.sub(
              r"(<!-- DEPLOY_MONITOR_START -->\n).*?(\n<!-- DEPLOY_MONITOR_END -->)",
              lambda m: m.group(1) + block + m.group(2),
              readme,
              flags=re.S,
          )
          if new == readme:
              raise SystemExit("::error::DEPLOY_MONITOR markers not found or unchanged in README.md")
          open("README.md", "w").write(new)
          PYEOF

      - name: Commit and push
        if: steps.probe.outputs.up_count != '0'
        run: |
          if git diff --quiet README.md; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update production status"
          # Four scheduled workflows commit to main and their crons overlap, so
          # another run can land between the rebase and the push. Retry the
          # whole rebase-and-push instead of failing the job on a lost race.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::rebase/push lost a race (attempt $attempt/5), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
